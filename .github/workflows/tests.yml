name: tests

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # The Debian of the README, with its PHP 8.4.
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PHP, curl and openssl
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
              php-cli php-sqlite3 curl openssl

      - name: Run the tests
        run: tests/run.sh
